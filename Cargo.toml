[workspace]
resolver = "3"
members = [
    "dco2",
    "dco2-aws-lambda",
    "dco2-server"
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99.1"

[workspace.dependencies]
anyhow = "1.0.104"
askama = "0.16.1"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
cached = { version = "4.1.0", features = ["async"] }
clap = { version = "4.6.7", features = ["derive"] }
chrono = "0.4.45"
email_address = "0.2.9"
figment = { version = "0.10.19", features = ["yaml", "env"] }
hmac = "0.13.0"
hex = "0.4.3"
http = "1.5.0"
indoc = "2.0.8"
lambda_http = "1.3.2"
mockall = "0.15.0"
octorust = "0.10.0"
pem = "4.0.0"
pretty_assertions = "1.4.1"
regex = "1.13.1"
# Keep reqwest-middleware and reqwest-retry in sync with the versions used by
# octorust, as the client passed to octorust::Client::custom must match them
reqwest-middleware = "0.4.2"
reqwest-retry = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = [
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["auth", "fs", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
